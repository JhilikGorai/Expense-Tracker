<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />">
</head>
<body>
     <!-- Top Headings -->
      <div class="heading">
        <h1>Expense Tracker</h1>
        <p>Manage your money, one expense at a time</p>
      </div>

        <!-- 3-boxes -->
    <div class="summary">
        <div class="balance" id="balance">
            <p>Balance</p>
            <h3 id="balance-amount">₹0</h3>
        </div>
        <div class="income" id="income">
            <p>Income</p>
            <h3 id="income-amount">₹0</h3>
        </div>
        <div class="expense" id="expense">
            <p>Expense</p>
            <h3 id="expense-amount">₹0</h3>
        </div>
    </div>

    <!-- Add Transaction -->
    <div class="add-transaction">
        <h4>Add Transaction</h4>

        <div class="description">
            <input type="text" id="desc" placeholder="Enter description...">
            <select id="type" class="type">
                <option value="">Type</option>
                <option value="income">Income</option>
                <option value="expense">Expense</option>
            </select>
            <input type="number" id="amount" placeholder="Amount (₹)">
            <button id="add-btn">Add Transaction</button>
        </div>

    </div>

    <div class="container">

        <div class="transaction-filter">
            <h5>Transaction History</h5>

            <div class="filter-buttons">
                <button id="all">All</button>
                <p>Income</p>
                <p>Expense</p>
            </div>
        </div>

        <!-- Transaction headings -->
    <div class="main">
            <span>Description</span>
            <span>Type</span>
            <span>Amount</span>
            <span>Date</span>
        
    </div>

    <!-- JavaScript will add transactions here -->
    <div class="transaction-list" id="transaction-list"></div>

    </div>

    <script src="script.js"></script>
</body>
</html>
